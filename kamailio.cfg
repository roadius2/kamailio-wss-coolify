#!KAMAILIO

debug=3
log_stderror=yes
log_facility=LOG_LOCAL0

# --- LOAD MODULES FIRST ---
# Core Modules
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "xlog.so"
loadmodule "textops.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "maxfwd.so"
loadmodule "siputils.so"
loadmodule "uri.so"
loadmodule "websocket.so" # <-- Now loaded before listen=ws
loadmodule "outbound.so"
loadmodule "nathelper.so"
loadmodule "kex.so"
loadmodule "sanity.so"

# --- THEN DEFINE LISTENERS ---
# Kamailio listens internally on TCP and WS
listen=tcp:0.0.0.0:5060
#listen=ws:0.0.0.0:5062   # <-- ws: should now be recognized

# --- OTHER GLOBAL PARAMS ---
tcp_connection_lifetime=3600
enable_tls=no  # Disable TLS because Coolify handles it

# --- MODULE PARAMETERS ---
modparam("sanity", "autodrop", 1)
modparam("usrloc", "db_mode", 0)
modparam("registrar", "method_filtering", 1)

# Optional WebSocket settings
modparam("websocket", "keepalive_mechanism", 1)
modparam("websocket", "ping_interval", 30)

# --- ROUTING LOGIC ---
route {
    # ... (rest of your route block) ...
}
