#!KAMAILIO

debug=3
log_stderror=yes
log_facility=LOG_LOCAL0

# Kamailio listens internally on TCP and WS
listen=tcp:0.0.0.0:5060
listen=ws:0.0.0.0:5062

tcp_connection_lifetime=3600
enable_tls=no  # Disable TLS because Coolify handles it

# Core Modules
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "xlog.so"
loadmodule "textops.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "maxfwd.so"
loadmodule "siputils.so"
loadmodule "uri.so"
loadmodule "websocket.so"
loadmodule "outbound.so"
loadmodule "nathelper.so"
loadmodule "kex.so"
loadmodule "sanity.so"

# Module Parameters
modparam("sanity", "autodrop", 1)
modparam("usrloc", "db_mode", 0)
modparam("registrar", "method_filtering", 1)

# Optional WebSocket settings
modparam("websocket", "keepalive_mechanism", 1)
modparam("websocket", "ping_interval", 30)

route {
    # Drop loops
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # Limit message size
    if (msg:len >= 2048) {
        sl_send_reply("513", "Message too big");
        exit;
    }

    # Basic sanity checks
    if (!sanity_check("1511", "7")) {
        xlog("Malformed SIP message from $si\n");
        exit;
    }

    # Handle SIP registrations
    if (is_method("REGISTER")) {
        save("location");
        sl_send_reply("200", "OK");
        exit;
    }

    # Relay INVITE to upstream SIP provider
    if (is_method("INVITE")) {
        xlog("INVITE received from $si\n");
        t_relay_to("udp:voip4.freephoneline.ca:5060");
        exit;
    }

    # Relay in-dialog requests
    if (is_method("ACK|BYE|CANCEL|INFO|OPTIONS|SUBSCRIBE|NOTIFY")) {
        t_relay();
        exit;
    }

    # Fallback for unsupported methods
    sl_send_reply("501", "Not Implemented");
}
